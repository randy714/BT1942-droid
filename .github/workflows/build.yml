name: Build B1942 Engine APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate All Project Files
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/b1942/engine
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'B1942EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "B1942Engine"
          include ':app'
          B1942EOF

          cat > build.gradle << 'B1942EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          B1942EOF

          cat > gradle.properties << 'B1942EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          B1942EOF

          cat > app/build.gradle << 'B1942EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.b1942.engine'
              compileSdk 34

              defaultConfig {
                  applicationId "com.b1942.engine"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
          }
          B1942EOF

          cat > app/src/main/AndroidManifest.xml << 'B1942EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"
                  tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="B1942 Engine"
                  android:theme="@style/Theme.B1942Engine"
                  android:requestLegacyExternalStorage="true"
                  android:largeHeap="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".GameActivity"
                      android:screenOrientation="landscape" />

                  <activity
                      android:name=".SettingsActivity"
                      android:screenOrientation="landscape" />

                  <activity
                      android:name=".FileBrowserActivity"
                      android:screenOrientation="landscape" />
              </application>
          </manifest>
          B1942EOF

          cat > app/src/main/res/values/colors.xml << 'B1942EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0D1B0E</color>
              <color name="olive">#2D4A1C</color>
              <color name="green">#4A7A2E</color>
              <color name="lgreen">#6B9B3A</color>
              <color name="gold">#D4A017</color>
              <color name="dark">#1A1A1A</color>
              <color name="gray">#4A4A4A</color>
              <color name="lgray">#B0B0B0</color>
              <color name="white">#E8E4D8</color>
              <color name="red">#8B1A1A</color>
              <color name="hp">#2ECC40</color>
          </resources>
          B1942EOF

          cat > app/src/main/res/values/themes.xml << 'B1942EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.B1942Engine" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/green</item>
                  <item name="colorPrimaryVariant">@color/olive</item>
                  <item name="colorOnPrimary">@color/white</item>
                  <item name="colorSecondary">@color/gold</item>
                  <item name="android:colorBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
              </style>
          </resources>
          B1942EOF

          cat > app/src/main/res/layout/activity_main.xml << 'B1942EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="BATTLEFIELD 1942"
                  android:textColor="@color/gold"
                  android:textSize="30sp"
                  android:textStyle="bold"
                  android:fontFamily="monospace" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="ENGINE LAUNCHER v1.0"
                  android:textColor="@color/lgreen"
                  android:textSize="12sp"
                  android:fontFamily="monospace"
                  android:layout_marginBottom="24dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Folder game belum dipilih"
                  android:textColor="@color/lgray"
                  android:textSize="13sp"
                  android:fontFamily="monospace"
                  android:layout_marginBottom="20dp" />

              <Button
                  android:id="@+id/btnFolder"
                  android:layout_width="300dp"
                  android:layout_height="50dp"
                  android:text="PILIH FOLDER GAME B1942"
                  android:backgroundTint="@color/olive"
                  android:textColor="@color/gold"
                  android:layout_marginBottom="8dp" />

              <Button
                  android:id="@+id/btnPlay"
                  android:layout_width="300dp"
                  android:layout_height="60dp"
                  android:text="PLAY"
                  android:backgroundTint="@color/green"
                  android:textColor="@color/white"
                  android:textSize="20sp"
                  android:enabled="false"
                  android:layout_marginBottom="8dp" />

              <Button
                  android:id="@+id/btnSettings"
                  android:layout_width="300dp"
                  android:layout_height="50dp"
                  android:text="SETTINGS"
                  android:backgroundTint="@color/olive"
                  android:textColor="@color/gold" />

              <TextView
                  android:id="@+id/tvInfo"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:textColor="@color/gray"
                  android:textSize="10sp"
                  android:fontFamily="monospace"
                  android:layout_marginTop="16dp" />
          </LinearLayout>
          B1942EOF

          cat > app/src/main/res/layout/activity_game.xml << 'B1942EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <LinearLayout
                  android:id="@+id/loading"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="@color/bg"
                  android:gravity="center"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="MEMUAT B1942..."
                      android:textColor="@color/gold"
                      android:textSize="22sp"
                      android:fontFamily="monospace" />

                  <ProgressBar
                      android:layout_width="200dp"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:indeterminate="true"
                      style="@style/Widget.AppCompat.ProgressBar.Horizontal" />

                  <TextView
                      android:id="@+id/tvLoad"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Init engine..."
                      android:textColor="@color/lgreen"
                      android:textSize="11sp"
                      android:fontFamily="monospace"
                      android:layout_marginTop="8dp" />
              </LinearLayout>

              <com.b1942.engine.TouchControlsView
                  android:id="@+id/controls"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />
          </FrameLayout>
          B1942EOF

          cat > app/src/main/res/layout/activity_settings.xml << 'B1942EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="SETTINGS"
                      android:textColor="@color/gold"
                      android:textSize="24sp"
                      android:gravity="center"
                      android:fontFamily="monospace"
                      android:layout_marginBottom="20dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="VOLUME"
                      android:textColor="@color/lgreen"
                      android:textSize="14sp"
                      android:fontFamily="monospace" />

                  <SeekBar
                      android:id="@+id/sbVol"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="80"
                      android:layout_marginBottom="16dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="UKURAN JOYSTICK"
                      android:textColor="@color/lgreen"
                      android:textSize="14sp"
                      android:fontFamily="monospace" />

                  <SeekBar
                      android:id="@+id/sbJoy"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="50"
                      android:layout_marginBottom="16dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="UKURAN TOMBOL"
                      android:textColor="@color/lgreen"
                      android:textSize="14sp"
                      android:fontFamily="monospace" />

                  <SeekBar
                      android:id="@+id/sbBtn"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="50"
                      android:layout_marginBottom="16dp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="TRANSPARANSI"
                      android:textColor="@color/lgreen"
                      android:textSize="14sp"
                      android:fontFamily="monospace" />

                  <SeekBar
                      android:id="@+id/sbAlpha"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="70"
                      android:layout_marginBottom="20dp" />

                  <Button
                      android:id="@+id/btnSave"
                      android:layout_width="match_parent"
                      android:layout_height="50dp"
                      android:text="SIMPAN"
                      android:backgroundTint="@color/green"
                      android:textColor="@color/white" />
              </LinearLayout>
          </ScrollView>
          B1942EOF

          cat > app/src/main/res/layout/activity_file_browser.xml << 'B1942EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="@color/bg">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:background="@color/olive"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:padding="8dp">

                  <Button
                      android:id="@+id/btnUp"
                      android:layout_width="wrap_content"
                      android:layout_height="40dp"
                      android:text="UP"
                      android:backgroundTint="@color/green"
                      android:textColor="@color/white"
                      android:textSize="12sp" />

                  <TextView
                      android:id="@+id/tvPath"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="/storage/"
                      android:textColor="@color/white"
                      android:textSize="11sp"
                      android:fontFamily="monospace"
                      android:singleLine="true"
                      android:layout_marginHorizontal="8dp" />

                  <Button
                      android:id="@+id/btnPick"
                      android:layout_width="wrap_content"
                      android:layout_height="40dp"
                      android:text="PILIH"
                      android:backgroundTint="@color/gold"
                      android:textColor="@color/dark"
                      android:textSize="12sp" />
              </LinearLayout>

              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rv"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />
          </LinearLayout>
          B1942EOF

          cat > app/src/main/java/com/b1942/engine/MainActivity.java << 'B1942EOF'
          package com.b1942.engine;

          import android.app.ActivityManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.File;

          public class MainActivity extends AppCompatActivity {

              private String path = "";
              private SharedPreferences sp;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  sp = getSharedPreferences("b1942", MODE_PRIVATE);
                  path = sp.getString("path", "");

                  ActivityManager am = (ActivityManager) getSystemService(ACTIVITY_SERVICE);
                  ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                  am.getMemoryInfo(mi);
                  long ramGB = mi.totalMem / (1024L * 1024L * 1024L);
                  ((TextView) findViewById(R.id.tvInfo)).setText("RAM: " + ramGB + "GB | Android " + Build.VERSION.RELEASE);

                  findViewById(R.id.btnFolder).setOnClickListener(v -> {
                      if (!hasPerm()) {
                          reqPerm();
                      } else {
                          startActivity(new Intent(this, FileBrowserActivity.class));
                      }
                  });

                  findViewById(R.id.btnPlay).setOnClickListener(v -> {
                      if (valid()) {
                          Intent i = new Intent
